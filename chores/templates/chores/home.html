<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load static %}<link rel="stylesheet" href="{% static 'chores/app.css' %}">
    <title>Choremate</title>
</head>
<body>
    <main>
        <h1>Choremate</h1>
        <p>Shared household chores, planned clearly.</p>
        {% if messages %}
            {% for message in messages %}
                <p role="status">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <nav aria-label="Main navigation">
            <a href="{% url 'chores:settings' %}">Settings</a>
            <a href="{% url 'chores:library' %}">Chore Library</a>
            <a href="{% url 'chores:occurrences' %}">Occurrences</a>
            <a href="{% url 'chores:week' %}">Weekly Planning</a>
            <a href="{% url 'chores:today' %}">Today</a>
            <a href="{% url 'chores:dashboard' %}">Dashboard</a>
            <a href="{% url 'chores:history' %}">History</a>
        </nav>
        <section aria-labelledby="active-member-heading">
            <h2 id="active-member-heading">Current member</h2>
            <form method="post" action="{% url 'chores:select_member' %}">
                {% csrf_token %}
                <label for="member_id">Who is using Choremate?</label>
                <select id="member_id" name="member_id">
                    {% for member in members %}
                        <option value="{{ member.id }}"{% if member.id == active_member_id %} selected{% endif %}>{{ member.name }}</option>
                    {% endfor %}
                </select>
                <button type="submit">Switch member</button>
            </form>
        </section>
    </main>
</body>
</html>
